<!doctype html><html><head><meta charset="utf-8"><title>Animated enemy preview</title><style>body{margin:0;font:14px sans-serif}#controls{position:fixed;top:20px;left:20px;padding:15px;background:#fffe;border-radius:8px}button{padding:8px;margin:4px}</style></head><body><div id="controls"><span id="wave">Wave 1</span><br><button id="one">Defeat one</button><button id="all">Clear wave</button><button id="reset">Reset waves</button></div><script type="module">
import * as THREE from './vendor/three.module.js';import {EnemyWaves} from './enemy-waves.js?v=big-1';import {createForest} from './forest.js?v=big-1';import {fitForestShadows} from './forest-shadows.js?v=big-1';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a6c9e3');scene.fog=new THREE.Fog('#a6c9e3',24,145);const obstacles=createForest(scene),sun=new THREE.DirectionalLight(0xffe0ac,1.7);sun.position.set(-30,50,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun,new THREE.HemisphereLight(0xd9edff,0x5d6240,1.2));fitForestShadows(sun,scene);
const waves=new EnemyWaves(scene,obstacles,{sound(){},landed(){}});await waves.ready;const player={x:0,z:8,yaw:0,config:{size:1.35}};
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.05,400);camera.position.set(0,2.295,20);camera.lookAt(0,1.5,28);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.BasicShadowMap;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;document.body.appendChild(renderer.domElement);
document.querySelector('#one').onclick=()=>waves.pool.find(e=>e.root.visible&&e.health>0)?.hit(1000);
document.querySelector('#all').onclick=()=>{for(const e of waves.pool)if(e.root.visible&&e.health>0)e.hit(1000);};document.querySelector('#reset').onclick=()=>waves.reset(player);
let shownWave=0;let last=performance.now();renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;for(const e of waves.pool)e.grace=1000;waves.step(dt,player);if(shownWave!==waves.wave){shownWave=waves.wave;for(let i=0;i<waves.pool.length;i++){const e=waves.pool[i];e.x=(i-(Math.min(waves.wave,waves.limit)-1)/2)*2;e.z=28;e.root.position.set(e.x,0,e.z);}}document.querySelector('#wave').textContent=waves.status;renderer.render(scene,camera);});
</script></body></html>
