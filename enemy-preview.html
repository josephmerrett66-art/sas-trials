<!doctype html><html><head><meta charset="utf-8"><title>Animated enemy preview</title><style>body{margin:0;font:14px sans-serif}#controls{position:fixed;top:20px;left:20px;padding:15px;background:#fffe;border-radius:8px}button{padding:8px;margin:4px}</style></head><body><div id="controls">Universal Animation Library 2 · Pursuer<br><button data-clip="Zombie_Idle_Loop">Idle</button><button data-clip="Zombie_Walk_Fwd_Loop">Chase</button><button data-clip="Zombie_Scratch">Attack</button><button data-clip="Hit_Knockback">Hit reaction</button><button id="fatal">Fatal hit</button><button id="restore">Reset</button></div><script type="module">
import * as THREE from './vendor/three.module.js';import {AnimatedEnemy} from './animated-enemy.js?v=enemy-7';import {createForest} from './forest.js?v=shadows-1';import {fitForestShadows} from './forest-shadows.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#a6c9e3');scene.fog=new THREE.Fog('#a6c9e3',24,145);const obstacles=createForest(scene),sun=new THREE.DirectionalLight(0xffe0ac,1.7);sun.position.set(-30,50,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun,new THREE.HemisphereLight(0xd9edff,0x5d6240,1.2));fitForestShadows(sun,scene);
const enemy=new AnimatedEnemy(scene,obstacles,{sound(){},landed(){}});await enemy.ready;enemy.setSize(1.35);enemy.x=0;enemy.z=0;enemy.root.position.set(0,0,0);enemy.root.rotation.y=Math.PI;
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.05,400);camera.position.set(0,2.295,5.5);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.BasicShadowMap;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;document.body.appendChild(renderer.domElement);
let simulate=false;const previewPlayer={x:0,z:5.5,yaw:0,config:{size:1.35}};
for(const button of document.querySelectorAll('[data-clip]'))button.onclick=()=>{simulate=button.dataset.clip==='Hit_Knockback';if(simulate){enemy.grace=1000;enemy.heading=enemy.root.rotation.y;enemy.hit(10);}else enemy.play(button.dataset.clip,false,true);};
document.querySelector('#fatal').onclick=()=>{simulate=true;enemy.hit(1000);};document.querySelector('#restore').onclick=()=>{simulate=false;enemy.reset();enemy.x=enemy.z=0;enemy.root.position.set(0,0,0);enemy.root.rotation.y=Math.PI;enemy.heading=Math.PI;};
let last=performance.now();renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;if(simulate)enemy.step(dt,previewPlayer);else{enemy.mixer.update(dt);enemy.groundPose();enemy.updateShadow();}renderer.render(scene,camera);});
</script></body></html>
