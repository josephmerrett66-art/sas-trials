<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Asset pack preview</title><style>body{margin:0;background:#aaa;font:14px sans-serif}#controls{position:fixed;top:20px;left:20px;background:#fff;padding:15px;border-radius:8px;z-index:2}button,select{padding:8px;margin:4px}#label{display:block}</style></head><body><div id="controls"><b>Imported pack preview</b><br><select id="weapon" aria-label="Weapon"></select><button id="shoot">Fire / attack</button><button id="reload">Reload</button><label><input id="aim" type="checkbox">Aim</label><span id="label">Loading…</span></div><script type="module">
import * as THREE from './vendor/three.module.js';import {Arsenal,loadouts} from './arsenal.js?v=no-flash-1';import {Controller} from './controller.js';import {MovementFeel} from './feel.js';import {PackWorld} from './pack-world.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xbcbcbc);const camera=new THREE.PerspectiveCamera(85,innerWidth/innerHeight,.05,300);scene.add(camera);const hemi=new THREE.HemisphereLight(0xffffff,0x555555,2.2);hemi.layers.enable(1);scene.add(hemi);const light=new THREE.DirectionalLight(0xffffff,2.4);light.layers.enable(1);light.position.set(-30,50,20);scene.add(light);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);const feel=new MovementFeel(),player=new Controller(),world=new PackWorld(scene,[]);const arsenal=new Arsenal(camera,scene,feel,world);await Promise.all([world.load(),arsenal.load()]);document.querySelector('#weapon').innerHTML=loadouts.map((s,i)=>`<option value="${i}">${s.name}</option>`).join('');document.querySelector('#weapon').onchange=e=>arsenal.select(Number(e.target.value));document.querySelector('#shoot').onclick=()=>{feel.unlockAudio();arsenal.fire();};document.querySelector('#reload').onclick=()=>arsenal.reload();let last=performance.now();renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-last)/1000);last=now;camera.rotation.set(player.pitch,player.yaw,0);arsenal.update(dt,player,feel,true,document.querySelector('#aim').checked);world.update(dt);document.querySelector('#label').textContent=arsenal.hud();camera.layers.set(0);renderer.autoClear=true;renderer.render(scene,camera);renderer.autoClear=false;renderer.clearDepth();camera.layers.set(1);const background=scene.background;scene.background=null;renderer.render(scene,camera);scene.background=background;});
</script></body></html>
